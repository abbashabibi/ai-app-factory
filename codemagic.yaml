workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    environment:
      groups:
        - app_factory
      vars:
        PACKAGE_NAME: "com.abbas.appfactory"
    scripts:
      - name: Check project
        script: |
          echo "Checking Android project..."
          test -f settings.gradle.kts || test -f settings.gradle
          test -d app
      - name: Build APK
        script: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
    artifacts:
      - app/build/outputs/apk/**/*.apk
