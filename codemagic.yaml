workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.abbas.appfactory"
        PROJECT_ROOT: "."
    scripts:
      - name: Check project
        script: |
          set -e
          PROJECT_ROOT="${PROJECT_ROOT:-.}"
          test -f "$PROJECT_ROOT/settings.gradle"
          test -d "$PROJECT_ROOT/app"
      - name: Build APK
        script: |
          set -e
          PROJECT_ROOT="${PROJECT_ROOT:-.}"
          cd "$PROJECT_ROOT"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
    artifacts:
      - $PROJECT_ROOT/app/build/outputs/apk/**/*.apk
