name: Wire durable job engine
on:
  push:
    branches: [feature/job-engine-wiring]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify backend
        run: cd backend && npm install && npm test
